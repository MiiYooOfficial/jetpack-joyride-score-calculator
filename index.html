<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jetpack Joyride Score Calculator</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.bg-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 100%;
    display: flex;
    z-index: -2;
    animation: scrollBackground 18s linear infinite;
}

.bg {
    width: 50%;
    background: url("background.png") repeat-x;
    background-size: cover;
}

@keyframes scrollBackground {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: -1;
}

.container {
    width: 520px;

    background: linear-gradient(
        to bottom,
        #2d3138,
        #1e2127
    );

    border: 4px solid #4b5059;
    border-radius: 16px;

    padding: 30px;

    position: relative;
    z-index: 10;

    box-shadow:
        0 0 30px rgba(0,0,0,0.6),
        inset 0 0 20px rgba(255,255,255,0.05);
}

.container::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 18px;

    border-radius: 12px 12px 0 0;

    background:
        repeating-linear-gradient(
            -45deg,
            #f4d03f 0px,
            #f4d03f 16px,
            #111 16px,
            #111 32px
        );
}

.container::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: 12px;

    pointer-events: none;

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.05);
}

h1 {
    text-align: center;

    color: #ffd94d;

    text-transform: uppercase;

    letter-spacing: 2px;

    margin-top: 12px;
    margin-bottom: 10px;

    text-shadow:
        0 0 8px rgba(255,217,77,0.4);

    font-size: 32px;
}

.hud-subtitle {
    text-align: center;

    color: #8cc6ff;

    font-size: 13px;

    letter-spacing: 3px;

    margin-bottom: 20px;

    opacity: 0.85;
}

.game-image {
    display: block;
    margin: 0 auto 25px auto;
    width: 240px;
}

label {
    display: block;

    margin-top: 18px;

    color: #f7f7f7;

    font-weight: bold;

    letter-spacing: 0.5px;
}

input[type="number"] {
    width: 100%;

    padding: 10px;

    margin-top: 8px;

    font-size: 16px;

    box-sizing: border-box;

    border-radius: 8px;

    border: 2px solid #555;

    background: #11161d;

    color: white;
}

.speed-display {
    text-align: center;

    font-size: 34px;

    font-weight: bold;

    color: white;

    margin-top: 12px;
    margin-bottom: 15px;

    text-shadow:
        0 0 12px rgba(255,255,255,0.25);
}

.slider-container {
    padding: 0 5px;
}

.speed-slider {
    width: 100%;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: #666;
}

.speed-slider::-webkit-slider-thumb {
    appearance: none;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: white;

    cursor: pointer;

    border: 2px solid #ccc;
}

.speed-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;

    border-radius: 50%;

    background: white;

    cursor: pointer;

    border: 2px solid #ccc;
}

.speed-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    color: #aaa;
    font-size: 13px;
}

button {
    margin-top: 25px;

    width: 100%;

    padding: 14px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    border: none;

    border-radius: 10px;

    color: #111;

    background:
        linear-gradient(
            to bottom,
            #ffe35f,
            #f4d03f
        );

    box-shadow:
        0 4px 0 #b18c12,
        0 8px 20px rgba(0,0,0,0.3);
}

button:hover {
    transform: translateY(-1px);
}

button:active {
    transform: translateY(2px);
}

.error {
    color: #ff6666;

    margin-top: 15px;

    text-align: center;
}

.score {
    margin-top: 20px;

    text-align: center;

    color: white;

    font-size: 22px;

    font-weight: bold;
}
</style>
</head>

<body>

<!-- Background -->

<div class="bg-wrapper">
    <div class="bg"></div>
    <div class="bg"></div>
</div>

<!-- Calculator -->

<div class="container">

    <h1>Jetpack Joyride</h1>

    <div class="hud-subtitle">
        LABORATORY PERFORMANCE ANALYSIS
    </div>

    <img
        src="logo.png"
        alt="Jetpack Joyride"
        class="game-image"
    >

    <label for="collisions">
        Number of Collisions
    </label>

    <input
        type="number"
        id="collisions"
        min="0"
        placeholder="Enter number of collisions"
    >

    <label>
        Playback Speed (Enter 1 for Default)
    </label>

    <div
        class="speed-display"
        id="speedDisplay"
    >
        1.00x
    </div>

    <div class="slider-container">

        <input
            type="range"
            min="0.25"
            max="2"
            step="0.05"
            value="1"
            id="speedSlider"
            class="speed-slider"
        >

        <div class="speed-labels">
            <span>0.25</span>
            <span>2.00</span>
        </div>

    </div>

    <label for="attempt">
        Attempt Number
    </label>

    <input
        type="number"
        id="attempt"
        min="1"
        placeholder="Enter attempt number"
    >

    <button onclick="calculateScore()">
        Calculate Score
    </button>

    <div id="error" class="error"></div>
    <div id="scoreDisplay" class="score"></div>

</div>

<script>

const speedSlider =
    document.getElementById("speedSlider");

const speedDisplay =
    document.getElementById("speedDisplay");

speedSlider.addEventListener("input", () => {

    speedDisplay.textContent =
        Number(speedSlider.value).toFixed(2) + "x";

});

function calculateScore() {

    const collisionsInput =
        document.getElementById("collisions")
            .value.trim();

    const attemptInput =
        document.getElementById("attempt")
            .value.trim();

    const playbackSpeed =
        parseFloat(speedSlider.value);

    const errorDiv =
        document.getElementById("error");

    const scoreDiv =
        document.getElementById("scoreDisplay");

    errorDiv.textContent = "";
    scoreDiv.innerHTML = "";

    const integerPattern = /^[0-9]+$/;

    if (!integerPattern.test(collisionsInput)) {

        errorDiv.textContent =
            "Number of collisions must contain digits only.";

        return;
    }

    if (!integerPattern.test(attemptInput)) {

        errorDiv.textContent =
            "Attempt number must contain digits only.";

        return;
    }

    const collisions =
        parseInt(collisionsInput, 10);

    const attempt =
        parseInt(attemptInput, 10);

    if (collisions < 0) {

        errorDiv.textContent =
            "Number of collisions must be 0 or greater.";

        return;
    }

    if (attempt <= 0) {

        errorDiv.textContent =
            "Attempt number must be positive.";

        return;
    }

    const score =
        Math.max(
            0,
            Math.round(
                1000 *
                Math.pow(playbackSpeed / 2, 0.5) *
                Math.pow(0.95, collisions) *
                Math.pow(0.97, attempt - 1)
            )
        );

    scoreDiv.innerHTML = `
        <div style="font-size:24px;">
            Your Final Score:
            <strong>${score}</strong>
        </div>

        <div style="
            margin-top:12px;
            font-size:16px;
            color:#ddd;
        ">
            Go back to the video and comment your score!
        </div>
    `;
}

</script>

</body>
</html>
